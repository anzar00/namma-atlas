name: Deploy Namma Atlas to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Validate JavaScript and atlas data
        run: |
          node --input-type=module --check < dist/app.js
          node --input-type=module --check < dist/canvas-map.js
          python3 scripts/validate_data.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the static website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: validate-and-package
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
